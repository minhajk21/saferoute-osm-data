# TEMPLATE for the PRIVATE backend repository (minhajk21/saferoute-backend),
# to be copied to .github/workflows/osm-data.yml there (DESIGN.md sections 4
# and 5). It does nothing in this repository: GitHub only runs workflows under
# .github/workflows/. Untested until it runs there.
#
# Needs, in the backend repository:
#   secret OSM_DATA_TOKEN  fine-grained PAT, repository minhajk21/saferoute-osm-data
#                          only, permission Actions: read and write. Used ONLY to
#                          re-enable and dispatch the data repo's build: if it
#                          expires, those two fail red, and everything else here
#                          (reading the releases, pinning) still runs on the
#                          backend's own token, since the data repo is public.
#   variable OSM_PIN_MODE  optional: 'pr' opens a pull request for each new pin
#                          (nothing deploys until someone merges it); anything
#                          else (default) commits the pin to main, which Render
#                          deploys. See "Who reviews a pin" below.
#   secret RENDER_DEPLOY_HOOK_URL  optional: set it ONLY if Render auto-deploy is
#                          off for the backend; a pushed pin then calls it.
#   data/osm-manifest.json the pinned release (written by this workflow).
#   data/osm-hold          optional: while this file exists the pin is never
#                          changed (to roll back: commit the older pin AND this
#                          file; delete it to resume).
#
# Every 6 hours:
#   1. Data age: from the newest release's manifest.json (data_as_of_epoch:
#      the oldest source extract), NOT the release's createdAt, which GitHub
#      sets to the date of the commit the release points at.
#   2. If the data repo's build workflow is not `active` (GitHub's 60-day
#      rule, or someone disabled it): enable it and FAIL.
#   3. If the newest data is more than 8.5 days old: dispatch a build and
#      FAIL, unless a build is already queued or running, or the last build
#      failed less than 72 hours ago (a failure that repeats would otherwise
#      cost Geofabrik a full ~12 GB download every 6 hours): then only FAIL.
#   4. If a newer release than the pinned one exists and data/osm-hold does
#      not: verify its provenance attestation (signer workflow = the data
#      repo's build.yml, source ref = its main branch, GitHub-hosted runner),
#      re-hash every asset against its manifest, require manifest.sanity.ok,
#      pack format 1, the manifest's own tag, and data NEWER than the pinned
#      data; then pin it (step 4 runs even when steps 1-3 failed).
#
# Who reviews a pin: nobody, in the default mode. The gate is automatic: the
# attestation (the files were built by build.yml on the data repo's main),
# the release's own sanity, golden and strict-area checks, and the hashes.
# A bad release still pinned that way (a bad OSM edit, a bad commit on the
# data repo's main) is deployed within 6 hours of its publication. Use
# OSM_PIN_MODE=pr to review each one before it deploys (then the data ages
# until it is merged: /health warns past 9 days and is critical past 10).
name: osm-data

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: osm-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATA_REPO: minhajk21/saferoute-osm-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is the weekly build alive?
        env:
          GH_TOKEN: ${{ github.token }}
          OSM_DATA_TOKEN: ${{ secrets.OSM_DATA_TOKEN }}
        run: |
          set -uo pipefail
          problem=0
          err() { echo "::error::$*"; problem=1; }
          d=$(mktemp -d)
          now=$(date -u +%s)
          age_h=""
          if gh release download --repo "$DATA_REPO" --pattern manifest.json --dir "$d" 2>"$d/err"; then
            asof=$(python3 -I -c "import json,sys; print(int(json.load(open(sys.argv[1]))['data_as_of_epoch']))" "$d/manifest.json") || asof=""
            if [ -n "$asof" ]; then
              age_h=$(( (now - asof) / 3600 ))
              echo "newest release's data is ${age_h} h old (data as of $(date -u -d "@$asof" +%FT%TZ))"
            else
              err "the newest release's manifest.json has no data_as_of_epoch"
            fi
          else
            err "could not read the newest release of $DATA_REPO: $(head -c 300 "$d/err")"
          fi
          state=$(GH_TOKEN="$OSM_DATA_TOKEN" gh api "repos/$DATA_REPO/actions/workflows/build.yml" --jq .state 2>"$d/err") || state="unknown ($(head -c 200 "$d/err"))"
          echo "build.yml state: $state"
          if [ "$state" != "active" ]; then
            if GH_TOKEN="$OSM_DATA_TOKEN" gh workflow enable build.yml --repo "$DATA_REPO"; then
              err "build.yml was $state: re-enabled"
            else
              err "build.yml is $state and could not be re-enabled (is OSM_DATA_TOKEN expired?)"
            fi
          fi
          if [ -z "$age_h" ] || [ "$age_h" -gt 204 ]; then
            last=$(gh run list --repo "$DATA_REPO" --workflow build.yml --limit 1 \
                     --json status,conclusion,createdAt,url --jq '.[0] // {} | "\(.status // "")|\(.conclusion // "")|\(.createdAt // "")|\(.url // "")"' 2>/dev/null || echo "")
            IFS='|' read -r st concl created url <<<"$last"
            since_h=999
            if [ -n "${created:-}" ]; then since_h=$(( (now - $(date -u -d "$created" +%s)) / 3600 )); fi
            if [ "${st:-}" = "queued" ] || [ "${st:-}" = "in_progress" ] || [ "${st:-}" = "waiting" ] || [ "${st:-}" = "pending" ]; then
              err "newest data is ${age_h:-?} h old; a build is already $st: $url"
            elif [ "${concl:-}" != "success" ] && [ "$since_h" -lt 72 ]; then
              err "newest data is ${age_h:-?} h old and the last build ($concl, ${since_h} h ago) failed: not dispatched again for 72 h, look at $url"
            elif GH_TOKEN="$OSM_DATA_TOKEN" gh workflow run build.yml --repo "$DATA_REPO"; then
              err "newest data is ${age_h:-?} h old: dispatched a build"
            else
              err "newest data is ${age_h:-?} h old and a build could not be dispatched (is OSM_DATA_TOKEN expired?)"
            fi
          fi
          echo "PROBLEM=$problem" >> "$GITHUB_ENV"

      - name: Pin a newer release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_MODE: ${{ vars.OSM_PIN_MODE }}
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -e data/osm-hold ]; then
            echo "::warning::data/osm-hold exists: the pin is left as it is"
            exit 0
          fi
          tag=$(gh release view --repo "$DATA_REPO" --json tagName --jq .tagName)
          pinned=$(python3 -I -c "import json; print(json.load(open('data/osm-manifest.json'))['tag'])" 2>/dev/null || echo none)
          echo "newest $tag, pinned $pinned"
          if [ "$tag" = "$pinned" ]; then exit 0; fi
          d=$(mktemp -d)
          gh release download "$tag" --repo "$DATA_REPO" --dir "$d" \
            --pattern manifest.json --pattern lighting.pack --pattern places.pack
          for f in manifest.json lighting.pack places.pack; do
            gh attestation verify "$d/$f" --repo "$DATA_REPO" \
              --signer-workflow "$DATA_REPO/.github/workflows/build.yml" \
              --source-ref refs/heads/main --deny-self-hosted-runners
          done
          python3 -I - "$d" "$tag" <<'EOF'
          import hashlib, json, os, sys
          d, tag = sys.argv[1], sys.argv[2]
          man = json.load(open(os.path.join(d, 'manifest.json')))
          if not man['sanity']['ok']:
              sys.exit('the release says its sanity checks failed')
          if man.get('format', {}).get('pack_version') != 1:
              sys.exit(f"pack format {man.get('format')}: the backend reads version 1")
          if man.get('tag') != tag:
              sys.exit(f"the manifest is for {man.get('tag')}, not {tag}")
          try:
              old = json.load(open('data/osm-manifest.json'))
              old_asof = old.get('data_as_of_epoch')
          except (OSError, ValueError):
              old_asof = None
          if old_asof is not None and man['data_as_of_epoch'] <= old_asof:
              sys.exit(f"{tag}'s data ({man['data_as_of']}) is not newer than the pinned data: not pinned")
          pin = {'tag': tag, 'data_as_of': man['data_as_of'], 'data_as_of_epoch': man['data_as_of_epoch'],
                 'built_at': man['built_at'],
                 'manifest_sha256': hashlib.sha256(open(os.path.join(d, 'manifest.json'), 'rb').read()).hexdigest(),
                 'assets': {}}
          for name in ('lighting.pack', 'places.pack'):
              data = open(os.path.join(d, name), 'rb').read()
              want = man['assets'][name]
              got = hashlib.sha256(data).hexdigest()
              if got != want['sha256'] or len(data) != want['bytes']:
                  sys.exit(f'{name}: {got}/{len(data)} does not match the manifest')
              pin['assets'][name] = {'bytes': want['bytes'], 'sha256': want['sha256'],
                                     'url': f'https://github.com/minhajk21/saferoute-osm-data/releases/download/{tag}/{name}'}
          os.makedirs('data', exist_ok=True)
          with open('data/osm-manifest.json', 'w') as f:
              json.dump(pin, f, indent=1, sort_keys=True)
              f.write('\n')
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/osm-manifest.json
          msg="Attestation verified (build.yml on $DATA_REPO main); sizes and SHA-256 match its manifest; data newer than the previous pin."
          git commit -m "osm-data: pin $tag" -m "$msg"
          if [ "${PIN_MODE:-}" = "pr" ]; then
            branch="osm-data/pin-$tag"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "::notice::$branch is already open for review"
              exit 0
            fi
            git push origin "HEAD:refs/heads/$branch"
            gh pr create --head "$branch" --base main --title "osm-data: pin $tag" \
              --body "$msg Merging deploys it. Until then /health shows the pinned copy's age."
          else
            git push origin HEAD:main
            if [ -n "${DEPLOY_HOOK:-}" ]; then curl -fsS -X POST "$DEPLOY_HOOK" >/dev/null && echo "deploy hook called"; fi
          fi

      - name: Fail when the build needed help
        if: env.PROBLEM == '1'
        run: exit 1
